<body>

    <nav class="navbar">
        <div class="container">
            <a href="Index 2.0.html" class="logo">💵 Money Tracker v2.0 </a>
            <ul class="nav-links">
                <li><a href="Index 2.0.html" class="active">Dashboard</a></li>
                <li><a href="Add Expenses.html">Add Expenses</a></li>

                <li><a href="categories.html">Categories</a></li>

    <main class="container main-content">
        <header class="dashboard-header">
            <h1>Dashboard></h1>
            <p class="subtittle"></p>
        </header>
        <section class="card-grid">
            <div class="card">
                <h3>Total Balance></h3>
                <p id="total-balance" class="card-value">$0.00</p>
            </div>
            <div class="card">
                <h3>Monthly Balance</h3>
                <p id="monthly-income" class="card-value text-success">$0.00</p>
            </div>
            <div class="card" >
                <h3>Monthly Expenses</h3>
                <p id="monthly-expenses" class="card-value text-danger">$0.00</p>
            </div>
        </section>

        <section class="recent-transactions-section">
            <div class="section-header">
                <h2>Recently Transactions</h2>
                <a href="Transaction.html" class="btn-link">&rarr;</a>
            </div>
            <div id="recent-transactions-container" class="table-responsive">
                <p class="empty-state"><a href="Add Expenses.html"></a></p>
            </div>
        </section>
